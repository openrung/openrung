<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenRung Relays</title>
  <style>
    :root{color-scheme:dark;--bg:#06100a;--panel:#0b1710;--panel2:#0e1d14;--line:#1e4b2d;--green:#55e27b;--green2:#1a9c49;--text:#e7f5eb;--muted:#89a994;--red:#ff7078;--amber:#f0bb53;--orange:#ff9d4d}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,#133d20 0,transparent 35%),var(--bg);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;min-height:100vh}button,select{font:inherit}header{position:sticky;top:0;z-index:3;display:flex;gap:18px;align-items:center;justify-content:space-between;padding:18px clamp(18px,4vw,54px);background:#06100aeF;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}h1{font-size:18px;margin:0;color:var(--green);letter-spacing:.04em}.subtitle{color:var(--muted);font-size:12px;margin-top:4px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,select{border:1px solid #327448;background:#0a1710;color:var(--text);padding:8px 11px;cursor:pointer}button:hover,select:hover{border-color:var(--green)}button.primary{background:var(--green);color:#041007;border-color:var(--green);font-weight:800}.logout{display:inline}.logout button{border-color:#63343a;color:#ffc1c4}main{width:min(1500px,94vw);margin:30px auto 70px}.status{display:none;padding:13px 16px;border:1px solid var(--line);background:var(--panel);margin-bottom:20px}.status.show{display:block}.status.error{border-color:#7d3339;color:#ffc1c4}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.card,.panel{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel2),var(--panel));box-shadow:0 16px 40px #0003}.card{padding:18px}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:27px;margin-top:9px;font-weight:800}.value.good{color:var(--green)}.value.bad{color:var(--red)}.value.volunteer{color:var(--orange)}.panel{padding:18px;min-width:0}.panel h2{font-size:13px;color:var(--green);margin:0 0 18px;text-transform:uppercase;letter-spacing:.07em}.split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #183923;white-space:nowrap}th{color:var(--muted);font-weight:400;text-transform:uppercase;font-size:10px}td.truncate{max-width:200px;overflow:hidden;text-overflow:ellipsis}.scroll{overflow:auto}.rank{display:grid;grid-template-columns:1fr auto;gap:9px 12px;align-items:center}.rank-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rank-count{color:var(--green)}.relay-foundation{color:var(--green)}.relay-volunteer{color:var(--orange)}.relay-class-marker{display:inline-block;margin-left:6px;padding:1px 4px;border:1px solid currentColor;font-size:9px;line-height:1.2;vertical-align:1px;letter-spacing:.04em}.empty{color:var(--muted);padding:18px 0}.badge{display:inline-block;padding:3px 7px;border:1px solid var(--line);font-size:10px}.badge.active{color:var(--green);border-color:#276b3d}.badge.inactive{color:var(--muted)}.meta{color:var(--muted);font-size:11px;margin-top:16px;text-align:right}.muted{color:var(--muted)}
    .nav{display:flex;gap:6px;margin-top:10px}.nav a{border:1px solid #327448;background:#0a1710;color:var(--text);padding:6px 10px;text-decoration:none;font-size:12px}.nav a:hover{border-color:var(--green)}.nav a.current{background:#153823;border-color:var(--green);color:var(--green)}
    @media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}.split{grid-template-columns:1fr 1fr}}
    @media(max-width:680px){header{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.value{font-size:22px}main{width:92vw;margin-top:18px}.panel{padding:14px}}
  </style>
</head>
<body>
  <header>
    <div>
      <h1>OPENRUNG / RELAYS</h1><div class="subtitle">Relay fleet — registry &amp; telemetry</div>
      <nav class="nav"><a href="/admin/telemetry">Overview</a><a class="current" href="/admin/telemetry/relays">Relays</a></nav>
    </div>
    <div class="actions">
      <select id="window" aria-label="History window"><option value="1h">Last hour</option><option value="24h" selected>Last 24 hours</option><option value="7d">Last 7 days</option></select>
      <button class="primary" id="refresh" type="button">Refresh</button>
      <form class="logout" method="post" action="/admin/telemetry/logout"><button type="submit">Sign out</button></form>
    </div>
  </header>
  <main>
    <div id="status" class="status">Loading relays…</div>
    <section class="cards" id="cards"></section>
    <section class="split">
      <article class="panel"><h2>Online by country</h2><div id="countries"></div></article>
      <article class="panel"><h2>Relay versions</h2><div id="versions"></div></article>
      <article class="panel"><h2>Fleet mix</h2><div id="mix"></div></article>
    </section>
    <section class="panel" style="margin-top:14px"><h2>Relays</h2><div class="scroll"><table><thead><tr><th>Relay</th><th>Status</th><th>Location</th><th>Endpoint</th><th>Transport</th><th>Version</th><th>Connected clients</th><th>Active sessions</th><th>Clients</th><th>Sessions</th><th>Success</th><th>Failed</th><th>Top failure</th><th>Speed</th><th>Last seen</th><th>Registered</th></tr></thead><tbody id="relays"></tbody></table></div></section>
    <div class="meta" id="meta"></div>
  </main>
  <script>
    const $=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const number=value=>new Intl.NumberFormat().format(value||0), ago=value=>value?new Intl.DateTimeFormat(undefined,{dateStyle:'short',timeStyle:'short'}).format(new Date(value)):'—';
    let loading=false;
    function status(message,error=false){$('status').textContent=message;$('status').className='status'+(message?' show':'')+(error?' error':'')}
    // Same class rendering as the overview page: bright green for foundation,
    // orange for volunteer, with a visible FND/VOL marker and accessible label.
    function relayName(text,cls){const c=cls==='foundation'?'relay-foundation':cls==='volunteer'?'relay-volunteer':'';if(!c)return text;const marker=cls==='foundation'?'FND':'VOL';return `<span class="${c}">${text}</span><span class="relay-class-marker ${c}" aria-label="${esc(cls)} relay">${marker}</span>`}
    function nodeTitle(c){return c?` · ${esc(c)}`:''}
    function ranks(items,emptyMessage){return items?.length?`<div class="rank">${items.map(x=>`<span class="rank-name" title="${esc(x.name)}">${esc(x.name)}</span><span class="rank-count">${number(x.count)}</span>`).join('')}</div>`:`<div class="empty">${esc(emptyMessage||'Nothing to show')}</div>`}
    function countRanks(rows,key){const counts=new Map();for(const row of rows){const name=key(row);if(!name)continue;counts.set(name,(counts.get(name)||0)+1)}return [...counts.entries()].map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name))}
    function locationCell(x){if(!x.country&&!x.country_code&&!x.city)return '—';const country=x.country_code||x.country||'';return esc(x.city?`${x.city}, ${country}`:(x.country||x.country_code))}
    function transportCell(x){if(!x.online)return '—';return esc([x.transport||'direct',x.punch_capable?'punch':null,x.wss_fronts?'wss':null].filter(Boolean).join(' · '))}
    function speedCell(x){if(!x.speed_tests)return '—';return `<span title="TTFB ${(x.average_ttfb_ms||0).toFixed(0)} ms · ${number(x.speed_tests)} tests">${(x.average_mbps||0).toFixed(1)} Mbps</span>`}
    // Last seen: the broker heartbeat for online relays, the latest telemetry
    // event for offline ones (their registration is gone).
    function lastSeenCell(x){const value=x.online?(x.last_heartbeat_at||x.last_seen_at):x.last_seen_at;return `<span title="${x.online?'last broker heartbeat':'last telemetry event'}">${esc(ago(value))}</span>`}
    function activeSessionsCell(x){const capacity=x.online&&x.max_sessions?` <span class="muted">/ ${number(x.max_sessions)}</span>`:'';return `<span title="active sessions${x.online&&x.max_sessions?' / advertised capacity':''}">${number(x.active_sessions)}${capacity}</span>`}
    function render(data){
      const t=data.totals,rows=data.relays||[],online=rows.filter(x=>x.online);
      const countryCount=new Set(online.map(x=>x.country_code||x.country).filter(Boolean)).size;
      $('cards').innerHTML=[['Relays online',t.online_relays,'good'],['Foundation',t.foundation_relays,'good'],['Volunteer',t.volunteer_relays,'volunteer'],['Offline (window)',t.offline_relays,t.offline_relays?'bad':''],['Connected clients',t.connected_clients,'good'],['Active sessions',t.active_sessions,'good'],['Session capacity',t.session_capacity,''],['Countries',countryCount,'']].map(([l,v,c])=>`<article class="card"><div class="label">${l}</div><div class="value ${c}">${number(v)}</div></article>`).join('');
      $('countries').innerHTML=ranks(countRanks(online,x=>x.country||x.country_code),'No location data yet');
      $('versions').innerHTML=ranks(countRanks(online,x=>x.relay_version||'unknown'),'No online relays');
      $('mix').innerHTML=ranks([{name:'Direct',count:t.direct_relays},{name:'Tunnel (hub)',count:t.tunnel_relays},{name:'Punch capable',count:t.punch_capable_relays},{name:'WSS fronted',count:t.wss_capable_relays}].filter(x=>x.count),'No online relays');
      $('relays').innerHTML=rows.length?rows.map(x=>`<tr><td class="truncate" title="${esc(x.relay_id)}${nodeTitle(x.node_class)}">${relayName(esc(x.label||x.relay_id),x.node_class)}</td><td><span class="badge ${x.online?'active':'inactive'}">${x.online?'online':'offline'}</span></td><td>${locationCell(x)}</td><td class="truncate" title="${esc(x.endpoint||'')}">${esc(x.endpoint||'—')}</td><td>${transportCell(x)}</td><td>${esc(x.relay_version||'—')}</td><td>${number(x.active_clients)}</td><td>${activeSessionsCell(x)}</td><td>${number(x.clients)}</td><td>${number(x.sessions)}</td><td>${number(x.successes)}</td><td>${number(x.failures)}</td><td class="truncate" title="${esc(x.top_failure_reason||'')}">${esc(x.top_failure_reason||'—')}</td><td>${speedCell(x)}</td><td>${lastSeenCell(x)}</td><td>${esc(ago(x.registered_at))}</td></tr>`).join(''):'<tr><td colspan="16" class="empty">No relays registered and no relay telemetry in this window</td></tr>';
      $('meta').textContent=`Updated ${ago(data.generated_at)} · counts cover the selected window · refresh manually for the latest data`;
    }
    async function fetchJSON(path){const response=await fetch(path,{headers:{Accept:'application/json'}});if(response.status===401){location.href='/admin/telemetry/login';throw new Error('signed out')}if(!response.ok)throw new Error((await response.json().catch(()=>({}))).error||`Server returned ${response.status}`);return response.json()}
    async function load(){if(loading)return;loading=true;$('refresh').disabled=true;status('Loading relays…');try{render(await fetchJSON('/admin/api/telemetry/relays?window='+encodeURIComponent($('window').value)));status('')}catch(error){status('Could not load relays: '+error.message,true)}finally{loading=false;$('refresh').disabled=false}}
    $('refresh').addEventListener('click',load);$('window').addEventListener('change',load);
    load();
  </script>
</body>
</html>
