name: e2e

# Run the network-lab scenarios (test/e2e) on each PR and push to main: the
# real broker, relay hub, relays and command-line client on a simulated
# internet inside one privileged container. Same entry point as local runs:
# `make e2e`. See test/e2e/README.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the lab image and run every scenario
        run: make e2e
