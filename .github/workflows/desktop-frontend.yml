# Runs the desktop frontend test suite and typecheck/build. Exists mainly so
# the license-notices guard (notices.test.ts pins the in-app GPL text
# byte-for-byte to LICENSE) actually fires in CI, not just on developer
# machines — the desktop-release workflow only packages, it never tests.
name: desktop-frontend

on:
  push:
    branches: [main]
    paths:
      - "desktop/frontend/**"
      - "desktop/scripts/**"
      - "desktop/VERSION"
      - "desktop/wails.json"
      - "LICENSE"
      - ".github/workflows/desktop-frontend.yml"
  pull_request:
    paths:
      - "desktop/frontend/**"
      - "desktop/scripts/**"
      - "desktop/VERSION"
      - "desktop/wails.json"
      - "LICENSE"
      - ".github/workflows/desktop-frontend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Test build version wiring
        working-directory: desktop
        run: node --test scripts/versioned-wails-build.test.mjs

      # Every staged desktop package must carry the repository's full
      # THIRD_PARTY_NOTICES.md and LICENSE (the linked sing-box engine embeds
      # a Windows driver binary whose license text lives there).
      - name: Test packaging notices contract
        working-directory: desktop
        run: node --test scripts/package-notices.test.mjs

      # The acceptance check every packaging script runs on the binary it just
      # built: right engine version, with_utls present, app version stamped
      # in, no LGPLv3 WinDivert driver in a Windows package.
      - name: Test bundled engine verification
        working-directory: desktop
        run: node --test scripts/verify-bundled-engine.test.mjs

      - name: Typecheck and build
        run: npm run build
