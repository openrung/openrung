name: client-release

# Cross-compiles the OpenRung client CLI (cmd/client) and publishes a GitHub
# Release on client-vX.Y.Z tags. Run manually (Actions → client-release → Run)
# for artifact-only test builds. Unlike the two Wails desktop apps this is
# pure Go, so a single Linux runner cross-compiles every target; a macOS
# runner then signs and notarizes the darwin binaries.

on:
  workflow_dispatch:
  push:
    tags: ["client-v[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Resolve client build version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(tr -d '\r\n' < cmd/client/VERSION)"
          if ! printf '%s\n' "$base_version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "invalid cmd/client/VERSION \"$base_version\" (want X.Y.Z)" >&2
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            expected_tag="client-v$base_version"
            if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
              echo "client release tag $GITHUB_REF_NAME disagrees with cmd/client/VERSION ($base_version); expected $expected_tag" >&2
              exit 1
            fi
            build_version="$base_version"
          else
            build_version="$base_version-dev+sha.${GITHUB_SHA:0:7}"
          fi

          # Peel in case someone hand-pushes an annotated tag: GITHUB_SHA is
          # then the tag object's SHA, and the binaries must report the commit.
          revision="$(git rev-parse "$GITHUB_SHA^{commit}")"

          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "cmd/client/VERSION -> $base_version (building $build_version, revision $revision)"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cross-compile all targets
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
          REVISION: ${{ steps.version.outputs.revision }}
        run: |
          set -euo pipefail
          # connectcore/client.appVersion is the telemetry identity (the
          # symbol the desktop app also stamps; proven resolvable by
          # desktop/scripts/version-injection.test.mjs). The buildinfo symbols
          # feed the `openrung-client version` output (proven resolvable by
          # internal/buildinfo/injection_test.go).
          ldflags="-s -w"
          ldflags="$ldflags -X github.com/openrung/openrung/connectcore/client.appVersion=$BUILD_VERSION"
          ldflags="$ldflags -X openrung/internal/buildinfo.version=$BUILD_VERSION"
          ldflags="$ldflags -X openrung/internal/buildinfo.revision=$REVISION"

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            bin="openrung-client"
            if [ "$goos" = "windows" ]; then
              bin="openrung-client.exe"
            fi
            outdir="dist/openrung-client-$goos-$goarch"
            mkdir -p "$outdir"
            echo "==> $target"
            # with_utls compiles the bundled sing-box runtime's uTLS/Reality
            # client in; without it the binary cannot dial any relay's Reality
            # endpoint (the version smoke test below fails on a build that
            # lost the tag). with_external_windivert keeps sing-box's embedded
            # WinDivert64.sys (LGPLv3, unused by this client) out of the
            # Windows binary and the release archives — the driver-content
            # check below fails a build that regresses this.
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -tags with_utls,with_external_windivert -ldflags "$ldflags" -o "$outdir/$bin" ./cmd/client
            # GPL text plus the attribution the statically linked third-party
            # set (sing-box and its transitive set, yamux, gorilla/websocket,
            # quic-go, golang.org/x/*) requires on every distribution channel.
            cp LICENSE THIRD_PARTY_NOTICES.md "$outdir/"
            if [ "$goos" = "windows" ]; then
              (cd dist && zip -qr "openrung-client-$goos-$goarch.zip" "openrung-client-$goos-$goarch")
            else
              tar -czf "dist/openrung-client-$goos-$goarch.tar.gz" -C dist "openrung-client-$goos-$goarch"
            fi
          done

      - name: Smoke-test version injection
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
          REVISION: ${{ steps.version.outputs.revision }}
        run: |
          set -euo pipefail
          got="$(./dist/openrung-client-linux-amd64/openrung-client version)"
          echo "openrung-client version -> $got"
          want_client="client/$BUILD_VERSION revision=$REVISION"
          if [ "$(printf '%s\n' "$got" | sed -n 1p)" != "$want_client" ]; then
            echo "version line mismatch: got \"$got\", want first line \"$want_client\"" >&2
            exit 1
          fi
          # The second line proves the bundled sing-box is the go.mod pin AND
          # that the with_utls tag made it into the build; a binary without it
          # cannot dial any relay's Reality endpoint.
          singbox_version="$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box)"
          want_singbox="sing-box/${singbox_version#v} (bundled, with_utls)"
          if [ "$(printf '%s\n' "$got" | sed -n 2p)" != "$want_singbox" ]; then
            echo "bundled sing-box line mismatch: got \"$got\", want second line \"$want_singbox\"" >&2
            exit 1
          fi

      # The release archives must ship no WinDivert driver: it is LGPLv3
      # (license-text obligations THIRD_PARTY_NOTICES.md deliberately does not
      # carry for this channel) and serves sing-box Windows backends the
      # client never uses. A build that silently drops the
      # with_external_windivert tag re-embeds it; compare against the exact
      # driver bytes from the pinned sing-box module.
      - name: Assert no embedded WinDivert driver (windows)
        shell: bash
        run: |
          set -euo pipefail
          ver="$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box)"
          asset="$(go env GOMODCACHE)/github.com/sagernet/sing-box@${ver}/common/windivert/assets/WinDivert64.sys"
          exe="dist/openrung-client-windows-amd64/openrung-client.exe"
          python3 -c 'import sys; a=open(sys.argv[1],"rb").read(4096); e=open(sys.argv[2],"rb").read(); sys.exit("windows binary embeds WinDivert64.sys: the with_external_windivert build tag was lost (see THIRD_PARTY_NOTICES.md section 8)" if a in e else 0)' "$asset" "$exe"
          echo "no WinDivert driver bytes in the windows binary"

      - uses: actions/upload-artifact@v4
        with:
          name: openrung-client-dist
          path: |
            dist/openrung-client-*.tar.gz
            dist/openrung-client-*.zip
          if-no-files-found: error

  # Sign and notarize the two darwin binaries so Gatekeeper accepts direct
  # downloads (unsigned builds show users a "could not verify free of
  # malware" block). Checksums are generated here, after the archives reach
  # their final bytes. The signing identity names only the organization —
  # release binaries must never carry a personal identity.
  sign-macos:
    needs: build
    runs-on: macos-14
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openrung-client-dist
          path: dist

      - name: Sign and notarize darwin binaries
        shell: bash
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SIGNING_IDENTITY: "Developer ID Application: OpenRung Foundation (9VLV9A7KS9)"
        run: |
          set -euo pipefail
          cd dist

          # Throwaway keychain: the runner is ephemeral, but scoping the key
          # to a dedicated keychain keeps it out of any login-keychain state
          # other steps might capture.
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_SIGNING_P12" | base64 -d > signing.p12
          # A secret uploaded from a file (gh secret set < file) keeps the
          # file's trailing newline, and the p12 MAC check fails on it as a
          # wrong password; strip line endings rather than trusting how the
          # secret was uploaded.
          p12_password="$(printf '%s' "$MACOS_SIGNING_P12_PASSWORD" | tr -d '\r\n')"
          security import signing.p12 -k "$keychain" -f pkcs12 -P "$p12_password" -T /usr/bin/codesign
          rm signing.p12
          security set-key-partition-list -S "apple-tool:,apple:" -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"

          printf '%s' "$NOTARY_KEY_P8" > notary.p8

          for arch in amd64 arm64; do
            dir="openrung-client-darwin-$arch"
            echo "==> $dir"
            tar xzf "$dir.tar.gz"
            codesign --sign "$SIGNING_IDENTITY" --options runtime --timestamp --force "$dir/openrung-client"

            # notarytool's exit code does not reliably reflect a rejected
            # submission; gate on the reported status explicitly.
            ditto -c -k "$dir/openrung-client" "notarize-$arch.zip"
            xcrun notarytool submit "notarize-$arch.zip" \
              --key notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              --wait --output-format json | tee "notary-$arch.json"
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); sys.exit(0 if r.get("status")=="Accepted" else f"notarization not accepted: {r}")' "notary-$arch.json"

            # End-to-end gate: Gatekeeper itself must accept the binary
            # (valid Developer ID signature + notarization ticket online).
            # -t install is deliberate: the execute policy only assesses app
            # bundles and rejects ANY bare CLI binary ("does not seem to be
            # an app"), notarized or not; install validates the same
            # signature+ticket chain and is the one that reports
            # "Notarized Developer ID" for a standalone executable.
            spctl -a -vv -t install "$dir/openrung-client"

            rm "$dir.tar.gz" "notarize-$arch.zip" "notary-$arch.json"
            tar -czf "$dir.tar.gz" "$dir"
            rm -r "$dir"
          done

          rm notary.p8
          security delete-keychain "$keychain"

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 openrung-client-*.tar.gz openrung-client-*.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: openrung-client-dist-signed
          path: |
            dist/openrung-client-*.tar.gz
            dist/openrung-client-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  # Publish a GitHub Release with every platform archive attached. Runs only
  # for client-vX.Y.Z tag pushes (not manual dispatch, which stays
  # artifact-only for testing).
  release:
    needs: [build, sign-macos]
    if: startsWith(github.ref, 'refs/tags/client-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag's GitHub Release + upload assets
    steps:
      - name: Download signed build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openrung-client-dist-signed
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenRung Client CLI v${{ needs.build.outputs.base_version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/openrung-client-*.tar.gz
            artifacts/**/openrung-client-*.zip
            artifacts/**/SHA256SUMS
