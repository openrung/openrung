name: broker-image

# Build and publish the broker (control plane) image to GHCR.
# Multi-arch (amd64 + arm64) so it runs on x86 and Graviton/ARM VPSes.

on:
  push:
    branches: [main]
    tags: ['broker-v[0-9]*']
    paths:
      - 'cmd/broker/**'
      - 'internal/broker/**'
      - 'internal/buildinfo/**'
      - 'internal/relay/**'
      - 'internal/wssbridge/**'
      - 'go.mod'
      - 'go.sum'
      - '.dockerignore'
      # The root go.mod replaces nested modules with local directories, so the
      # broker's build/download layers depend on their contents too.
      - 'brokerapi/go.mod'
      - 'punchcore/go.mod'
      - 'wsscore/**'
      - 'deploy/broker/**'
      - '.github/workflows/broker-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - id: version
        name: Resolve broker build version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(tr -d '\r\n' < cmd/broker/VERSION)"
          if ! printf '%s\n' "$base_version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "invalid cmd/broker/VERSION \"$base_version\" (want X.Y.Z)" >&2
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            expected_tag="broker-v$base_version"
            if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
              echo "broker release tag $GITHUB_REF_NAME disagrees with cmd/broker/VERSION ($base_version); expected $expected_tag" >&2
              exit 1
            fi
            build_version="$base_version"
            is_release=true
          else
            build_version="$base_version-dev+sha.${GITHUB_SHA:0:7}"
            is_release=false
          fi

          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository_owner }}/openrung-broker
          # sha-* stays a dev-build identity. A release build of a commit main
          # already built injects a different build version via -ldflags, so it produces
          # different bits; re-pushing sha-<commit> would repoint a tag the fleet
          # pins to. Releases are addressed by X.Y.Z or digest instead.
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.base_version }},enable=${{ steps.version.outputs.is_release == 'true' }}
            type=sha,enable=${{ steps.version.outputs.is_release != 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.build_version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/broker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BROKER_VERSION=${{ steps.version.outputs.build_version }}
            VCS_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
