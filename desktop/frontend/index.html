<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenRung</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #030604;
      }
      body {
        overflow: hidden;
        cursor: default;
      }
      #root {
        display: flex;
      }
      /* This is app chrome, not a document: nothing is selectable unless a
         component opts in (React Native's `selectable`) or it is a text field. */
      * {
        -webkit-user-select: none;
        user-select: none;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      /* Browser surfaces in the app's palette: the window is resizable, so
         scroll areas, keyboard focus and selected text all show up. */
      * {
        scrollbar-width: thin;
        scrollbar-color: #294f35 transparent;
      }
      ::selection {
        background: rgba(101, 245, 138, 0.3);
        color: #d8ffe0;
      }
      :focus {
        outline: none;
      }
      :focus-visible {
        outline: 2px solid #65f58a;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
